<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<script>
  const lang = navigator.language || navigator.userLanguage;

  if (lang.startsWith("de")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/ft4b2goixD5kSMP";
  } else if (lang.startsWith("en")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/mZyFqFmKiTtcDkM";
  } else if (lang.startsWith("fr")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/EDLNW5Nf68L9iZL";
  } else if (lang.startsWith("ar")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/wd2NQfbwBpeCjxB";
  } else if (lang.startsWith("zh")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/QHwR78Q6Eb54imp";
  } else if (lang.startsWith("tr")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/3QzdCWDzJKsZYxx";
  } else if (lang.startsWith("ko")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/iJC6aR2DtrgCWMT";
  } else if (lang.startsWith("pt")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/sF5Q3aedmLbPy9a";
  } else if (lang.startsWith("ru")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/3DZqkrgKL4P3brz";
  } else if (lang.startsWith("uk")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/5T9KpxLqSmSSokX";
  } else {
    // Optionaler Fallback, falls keine der oben genannten Sprachen zutrifft
    window.location.href = "https://URL2.de"; // z. B. englische Standardseite
  }
</script>

<p>Sie werden weitergeleitet…</p>
</body>
</html>
